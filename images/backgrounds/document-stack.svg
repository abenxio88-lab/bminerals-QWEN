<svg xmlns="http://www.w3.org/2000/svg" width="460" height="560" viewBox="0 0 460 560" fill="none">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Back page -->
  <g transform="rotate(-10 230 280)" filter="url(#sh)">
    <rect x="62" y="36" width="300" height="420" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="86" y="62" width="90" height="9" fill="#334155" opacity="0.45"/>
    <rect x="86" y="80" width="200" height="5" fill="#94a3b8"/>
    <rect x="86" y="96" width="250" height="5" fill="#cbd5e1"/>
    <rect x="86" y="112" width="230" height="5" fill="#e2e8f0"/>
    <rect x="86" y="128" width="250" height="5" fill="#e2e8f0"/>
  </g>

  <!-- Middle page -->
  <g transform="rotate(5 230 280)" filter="url(#sh)">
    <rect x="90" y="52" width="300" height="420" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="114" y="78" width="70" height="9" fill="#1e293b" opacity="0.5"/>
    <rect x="114" y="96" width="180" height="5" fill="#94a3b8"/>
    <rect x="114" y="112" width="240" height="5" fill="#cbd5e1"/>
    <rect x="114" y="128" width="210" height="5" fill="#e2e8f0"/>
  </g>

  <!-- Front page -->
  <g transform="rotate(-3 230 280)" filter="url(#sh)">
    <rect x="104" y="68" width="300" height="424" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- letterhead -->
    <rect x="104" y="68" width="300" height="6" rx="3" fill="#1e293b"/>
    <rect x="128" y="96" width="112" height="12" fill="#1e293b" opacity="0.8"/>
    <rect x="128" y="116" width="56" height="4" fill="#64748b"/>
    <rect x="318" y="96" width="62" height="5" fill="#94a3b8"/>
    <rect x="334" y="108" width="46" height="5" fill="#cbd5e1"/>
    <line x1="128" y1="138" x2="380" y2="138" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- body text -->
    <rect x="128" y="158" width="150" height="7" fill="#475569" opacity="0.7"/>
    <rect x="128" y="180" width="252" height="5" fill="#cbd5e1"/>
    <rect x="128" y="195" width="238" height="5" fill="#cbd5e1"/>
    <rect x="128" y="210" width="252" height="5" fill="#e2e8f0"/>
    <rect x="128" y="225" width="200" height="5" fill="#e2e8f0"/>

    <!-- bar chart in grayscale -->
    <line x1="128" y1="360" x2="380" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="128" y1="262" x2="128" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="128" y1="300" x2="380" y2="300" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="128" y1="330" x2="380" y2="330" stroke="#f1f5f9" stroke-width="1"/>
    <rect x="148" y="318" width="26" height="42" fill="#cbd5e1"/>
    <rect x="186" y="298" width="26" height="62" fill="#94a3b8"/>
    <rect x="224" y="282" width="26" height="78" fill="#64748b"/>
    <rect x="262" y="270" width="26" height="90" fill="#334155"/>
    <rect x="300" y="290" width="26" height="70" fill="#475569"/>
    <rect x="338" y="276" width="26" height="84" fill="#1e293b"/>

    <!-- footer lines + monochrome seal -->
    <rect x="128" y="386" width="170" height="5" fill="#cbd5e1"/>
    <rect x="128" y="401" width="210" height="5" fill="#cbd5e1"/>
    <rect x="128" y="416" width="140" height="5" fill="#e2e8f0"/>
    <circle cx="348" cy="438" r="24" stroke="#475569" stroke-width="2" opacity="0.6"/>
    <circle cx="348" cy="438" r="17" stroke="#64748b" stroke-width="1" opacity="0.5"/>
    <path d="M339 439 L346 446 L358 431" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <rect x="128" y="456" width="60" height="4" fill="#cbd5e1"/>
  </g>
</svg>
