name: Deploy Website

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production CSS
        run: npm run build:css

      - name: Run production checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Clean stranded FTP temporary files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/.lighthouserc.json
            *.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1

      - name: Clean stranded FTP temporary files (before retry 2)
        if: steps.ftp1.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/.lighthouserc.json
            *.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1

      - name: Clean stranded FTP temporary files (before retry 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/.lighthouserc.json
            *.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1
