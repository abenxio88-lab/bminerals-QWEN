name: Deploy Website

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production CSS
        run: npm run build:css

      - name: Run production checks
        run: npm run check

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate production DB config from GitHub Secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          MAIL_IMAP_PASS: ${{ secrets.MAIL_IMAP_PASS }}
          INFO_MAIL_PASS: ${{ secrets.INFO_MAIL_PASS }}
          SUPPORT_MAIL_PASS: ${{ secrets.SUPPORT_MAIL_PASS }}
        run: |
          node - << 'EOF'
          const fs = require('fs');
          const dbPass = process.env.DB_PASS || '';
          if (!dbPass) {
            console.error('::error::Missing DB_PASS secret in GitHub Repository Secrets (Settings -> Secrets and variables -> Actions).');
            process.exit(1);
          }
          const esc = (v) => "'" + String(v).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
          const lines = [
            '<?php',
            "define('DB_HOST', " + esc(process.env.DB_HOST || 'localhost') + ');',
            "define('DB_NAME', " + esc(process.env.DB_NAME || 'u284582092_bmdatabase') + ');',
            "define('DB_USER', " + esc(process.env.DB_USER || 'u284582092_bmuser') + ');',
            "define('DB_PASS', " + esc(dbPass) + ');',
          ];
          if (process.env.MAIL_IMAP_PASS) {
            lines.push("define('MAIL_IMAP_PASS', " + esc(process.env.MAIL_IMAP_PASS) + ');');
          }
          if (process.env.INFO_MAIL_PASS) {
            lines.push("define('INFO_MAIL_PASS', " + esc(process.env.INFO_MAIL_PASS) + ');');
          }
          if (process.env.SUPPORT_MAIL_PASS) {
            lines.push("define('SUPPORT_MAIL_PASS', " + esc(process.env.SUPPORT_MAIL_PASS) + ');');
          }
          fs.writeFileSync('admin/db-config.php', lines.join('\n') + '\n', 'utf8');
          console.log('Generated admin/db-config.php for production deploy.');
          EOF

      - name: Clean stranded FTP temporary files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/.agents/**
            **/.claude/**
            **/.qwen/**
            **/.trae/**
            **/.windsurf/**
            **/.chrome-profile-verify/**
            **/backups/**
            **/_backups/**
            **/backup-BM/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/admin/mail-config.php
            **/admin/uploads/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/*.sql
            **/.lighthouserc.json
            product-metallic-navbar.png
            products-mobile-industrial-audit.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1

      - name: Clean stranded FTP temporary files (before retry 2)
        if: steps.ftp1.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/.agents/**
            **/.claude/**
            **/.qwen/**
            **/.trae/**
            **/.windsurf/**
            **/.chrome-profile-verify/**
            **/backups/**
            **/_backups/**
            **/backup-BM/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/admin/mail-config.php
            **/admin/uploads/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/*.sql
            **/.lighthouserc.json
            product-metallic-navbar.png
            products-mobile-industrial-audit.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1

      - name: Clean stranded FTP temporary files (before retry 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: node scripts/cleanup-ftp-temp.js

      - name: FTP Deployment (attempt 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /
          timeout: 600000
          log-level: standard
          exclude: |
            **/.git/**
            **/.github/**
            **/.vscode/**
            **/.agents/**
            **/.claude/**
            **/.qwen/**
            **/.trae/**
            **/.windsurf/**
            **/.chrome-profile-verify/**
            **/backups/**
            **/_backups/**
            **/backup-BM/**
            **/graphify-out/**
            **/node_modules/**
            **/scripts/**
            **/src/**
            **/?Originals?/**
            **/B Minerals/**
            **/admin/mail-config.php
            **/admin/uploads/**
            **/package.json
            **/package-lock.json
            **/postcss.config.js
            **/tailwind.config.js
            **/*.md
            **/*.sql
            **/.lighthouserc.json
            product-metallic-navbar.png
            products-mobile-industrial-audit.png
            production-audit-plan.txt
            update-navbar.js
            update-navbar.ps1
